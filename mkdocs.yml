site_name: k3daemonize
site_description: Create daemon processes with CLI for start/stop/restart
site_url: https://k3daemonize.readthedocs.io
repo_url: https://github.com/pykit3/k3daemonize
repo_name: pykit3/k3daemonize

theme:
  name: material
  palette:
    primary: blue
    accent: blue

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
